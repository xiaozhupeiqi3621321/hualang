<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浣滃搧鐢诲粖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0c29;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 22px; background: linear-gradient(90deg, #f093fb, #f5576c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .count { color: rgba(255,255,255,0.5); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      background: #fff;
    }
    .card-body {
      padding: 12px 14px;
    }
    .card-message {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
      word-break: break-word;
    }
    .card-message.empty { color: rgba(255,255,255,0.3); font-style: italic; }
    .card-time {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 6px;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.4);
      grid-column: 1 / -1;
    }
    .empty-state h2 { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 60px; color: rgba(255,255,255,0.4); grid-column: 1 / -1; }
    .lock-overlay {
      position: fixed; inset: 0; background: #0f0c29;
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .lock-box {
      background: rgba(255,255,255,0.04); padding: 30px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06); text-align: center;
    }
    .lock-box input {
      display: block; width: 200px; padding: 10px; margin: 16px auto;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
      background: rgba(255,255,255,0.05); color: #fff; font-size: 16px; text-align: center;
    }
    .lock-box .btn {
      padding: 10px 28px; border: none; border-radius: 8px;
      background: linear-gradient(90deg, #f093fb, #f5576c); color: #fff;
      font-size: 15px; cursor: pointer; font-weight: 600;
    }
    .lock-box .error { color: #f5576c; font-size: 13px; margin-top: 8px; min-height: 20px; }
    .lock-box h2 { font-size: 18px; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-box">
      <h2>馃敀 鐢诲粖闇€瑕佸瘑鐮?/h2>
      <input type="password" id="passwordInput" placeholder="杈撳叆璁块棶瀵嗙爜" />
      <button class="btn" id="unlockBtn">瑙ｉ攣</button>
      <div class="error" id="lockError"></div>
    </div>
  </div>

  <div class="header" id="header" style="display:none">
    <h1>馃柤 浣滃搧鐢诲粖</h1>
    <span class="count" id="count">鍏?0 骞呬綔鍝?/span>
  </div>
  <div class="grid" id="grid">
    <div class="loading">鍔犺浇涓€?/div>
  </div>

  <script>
    const lockOverlay = document.getElementById('lockOverlay');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const lockError = document.getElementById('lockError');
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const header = document.getElementById('header');

    async function loadGallery() {
      grid.innerHTML = '<div class="loading">鍔犺浇涓€?/div>';
      try {
        const res = await fetch('/api/list');
        if (!res.ok) throw new Error('鍔犺浇澶辫触');
        const data = await res.json();
        renderGallery(data);
      } catch (err) {
        grid.innerHTML = '<div class="empty-state"><h2>馃槩</h2><p>鍔犺浇澶辫触锛岃鍒锋柊閲嶈瘯</p></div>';
      }
    }

    function renderGallery(items) {
      count.textContent = `鍏?${items.length} 骞呬綔鍝乣;
      if (items.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h2>馃帹</h2><p>杩樻病鏈変汉鎻愪氦浣滃搧</p></div>';
        return;
      }
      grid.innerHTML = items.map(item => `
        <div class="card">
          <img src="${item.image}" alt="浣滃搧" loading="lazy" />
          <div class="card-body">
            <div class="card-message ${item.message ? '' : 'empty'}">${item.message || '锛堟湭鐣欐枃瀛楋級'}</div>
            <div class="card-time">${new Date(item.createdAt).toLocaleString('zh-CN')}</div>
          </div>
        </div>
      `).join('');
    }

    unlockBtn.addEventListener('click', async () => {
      const pwd = passwordInput.value.trim();
      if (!pwd) { lockError.textContent = '璇疯緭鍏ュ瘑鐮?; return; }
      lockError.textContent = '';
      try {
        const res = await fetch('/api/list?password=' + encodeURIComponent(pwd));
        if (res.status === 401) { lockError.textContent = '瀵嗙爜閿欒'; return; }
        if (!res.ok) { lockError.textContent = '楠岃瘉澶辫触'; return; }
        lockOverlay.style.display = 'none';
        header.style.display = 'flex';
        const data = await res.json();
        renderGallery(data);
      } catch (err) {
        lockError.textContent = '缃戠粶閿欒';
      }
    });

    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockBtn.click(); });
  </script>
</body>
</html>
